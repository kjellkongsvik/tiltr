[package]
name = "tiltr"
version = "0.4.0"
authors = ["Kjell W. Kongsvik <kjell.kongsvik@gmail.com>"]
edition = "2024"

[dependencies]
bluer = { version = "0.17", features = ["full"] }
futures = { version = "0.3", features = ["futures-executor"] }
thiserror = "2"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
bincode = "2"
